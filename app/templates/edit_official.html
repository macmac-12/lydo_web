{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="card-title mb-3">Edit Official</h4>
                <form method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input class="form-control" name="name" value="{{ official.name }}" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Barangay</label>
                        <input class="form-control" name="barangay" value="{{ official.barangay }}" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Replace Photo (optional)</label>
                        <input type="file" class="form-control" name="photo" accept="image/*" />
                    </div>
                    <button class="btn btn-primary" type="submit">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
