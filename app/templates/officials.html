{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 class="fs-5 fs-md-4 mb-0">SK Chairpersons</h2>
</div>

<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3">
    {% for leader in leaders %}
    <div class="col">
        <div class="card h-100 shadow-sm border-0">
            <img src="{{ url_for('static', filename='portraits/' + leader.photo_url) }}" 
                 class="card-img-top" alt="{{ leader.name }}" 
                 style="height: 200px; object-fit: cover;">
            <div class="card-body text-center d-flex flex-column">
                <h6 class="card-title fw-bold">{{ leader.name }}</h6>
                <p class="card-text text-muted small">Barangay {{ leader.barangay }}</p>
                {% if current_user.is_authenticated and current_user.is_admin %}
                <div class="d-flex justify-content-center gap-2 mt-auto">
                    <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('main.edit_official', official_id=leader.id) }}">Edit</a>
                    <form method="post" action="{{ url_for('main.delete_official', official_id=leader.id) }}" style="display:inline" onsubmit="return confirm('Delete this official?');">
                        <button class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12 text-center py-5">
        <p class="text-muted">No officials added yet.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
