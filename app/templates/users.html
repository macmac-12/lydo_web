{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h3 class="mb-0">Users</h3>
    <a class="btn btn-sm btn-primary" href="{{ url_for('main.create_user') }}">Create new user</a>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="table-light">
            <tr><th>Username</th><th>Role</th><th class="text-center">Actions</th></tr>
        </thead>
        <tbody>
            {% for u in users %}
                <tr>
                    <td data-label="Username">{{ u.username }}</td>
                    <td data-label="Role">{{ u.role }}</td>
                    <td data-label="Actions" class="text-center">
                        <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('main.edit_user', user_id=u.id) }}">Edit</a>
                        <form method="post" action="{{ url_for('main.delete_user', user_id=u.id) }}" style="display:inline" onsubmit="return confirm('Delete user?');">
                            <button class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
            {% else %}
                <tr><td colspan="3" class="text-center">No users</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
