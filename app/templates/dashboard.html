{% extends "base.html" %}
{% block content %}
<h2 class="mb-3 fs-5 fs-md-4">LYDO Monitoring Dashboard</h2>

<div class="row g-3">
    <div class="col-12 col-lg-8">
        <div class="card shadow-sm p-3">
            <h6 class="mb-3">Youth Population by Barangay</h6>
            <div style="position: relative; height: 300px; width: 100%;">
                <canvas id="youthChart"></canvas>
            </div>
        </div>
    </div>

    <div class="col-12 col-lg-4">
        <div class="card shadow-sm p-3 bg-primary text-white mb-3">
            <h6 class="mb-2">Total Profiles</h6>
            <h3 class="mb-0">{{ values|sum }}</h3>
        </div>
        <div class="card shadow-sm p-3 bg-success text-white">
            <h6 class="mb-2">Active Barangays</h6>
            <h3 class="mb-0">{{ labels|length }}</h3>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const ctx = document.getElementById('youthChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: {{ labels|tojson }},
            datasets: [{
                label: 'Number of Youth',
                data: {{ values|tojson }},
                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            indexAxis: window.innerWidth < 768 ? 'y' : 'x',
            scales: { y: { beginAtZero: true } }
        }
    });
</script>
{% endblock %}
