{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Add New SK Chairperson</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Barangay</label>
                        <input type="text" name="barangay" class="form-control" placeholder="e.g. San Jose" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Official Portrait</label>
                        <input type="file" name="photo" class="form-control" accept="image/*" required>
                        <div class="form-text">Recommended: Square aspect ratio (1:1).</div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Upload Official</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
